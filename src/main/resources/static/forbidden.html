<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<title data-i18n="fb.title">مرقاب</title>
<script src="assets/js/i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="assets/css/mergab.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
<main class="card card-pad" style="width:min(460px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 28px 36px;overflow:hidden">
  <div class="sadu sadu-thin" aria-hidden="true" style="margin:0 -28px 18px;width:calc(100% + 56px)"></div>
  <span aria-hidden="true" style="width:64px;height:64px;border-radius:18px;background:#FBECEA;color:#B03A2E;display:flex;align-items:center;justify-content:center">
    <span class="msr" style="font-size:32px">lock</span>
  </span>
  <span style="font-family:var(--display);font-size:15px;color:var(--muted);font-weight:600">403</span>
  <h1 style="font-size:26px" data-i18n="fb.h1"></h1>
  <p style="margin:0;color:var(--muted)" id="msg" data-i18n="fb.msg"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px">
    <a class="btn btn-primary" id="homeBtn" href="visitor/index.html" data-i18n="fb.home"></a>
    <button type="button" class="btn btn-ghost" id="switchBtn" data-i18n="fb.switch"></button>
  </div>
</main>
<script src="assets/js/site-config.js"></script>
<script src="assets/js/mock-server.js"></script>
<script src="assets/js/api.js"></script>
<script>
  const { auth, roleBadge } = Mergab;
  const me = auth.get();
  document.getElementById('switchBtn').addEventListener('click', () => auth.logout());
  document.addEventListener('DOMContentLoaded', () => {
    if (!me) return;
    document.getElementById('msg').innerHTML = t('fb.msgRole', { r: roleBadge(me.role) });
    document.getElementById('homeBtn').href = auth.home(me.role);
  });
</script>
</body>
</html>
