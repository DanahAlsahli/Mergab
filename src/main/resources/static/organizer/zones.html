<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<title data-i18n="o.t.zones">مرقاب</title>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/i18n-staff.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/mergab.css">
</head>
<body data-area="organizer" data-page="zones">
<header id="vHeader"></header>

<main>
  <section class="page-band o-band" id="band">
    <div class="geo" aria-hidden="true"></div>
    <div class="o-wrap">
      <div><span class="eyebrow" data-i18n="motto"></span>
        <h1 id="bandH" data-i18n="o.nav.zones"></h1>
        <p id="bandP" data-i18n="o.zones.sub"></p></div>
    </div>
  </section>
  <div class="sadu" aria-hidden="true"></div>

  <div class="o-wrap o-body">
    <section id="zonesTable"></section>
  </div>
</main>

<footer id="vFooter"></footer>

<script src="../assets/js/site-config.js"></script>
<script src="../assets/js/mock-server.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/organizer.js"></script>
<script>
  const { api, esc, num, level } = Mergab;
  const I = Org.icon;
  if (Org.shell()) {
    const table = Org.mount({
      el: '#zonesTable',
      title: t('o.zones.all'), addLabel: t('o.zones.add'), editTitle: t('o.zones.edit'), emptyText: t('o.zones.empty'),
      load: () => api.get('/zone/get'),
      searchText: z => z.name + ' ' + Mergab.zoneName(z),
      columns: [
        { label: t('o.col.zone'), render: z => Org.zoneCell(z) },
        { label: t('o.col.capacity'), render: z => num(z.capacity) },
        { label: t('o.col.visitors'), render: z => num(z.initialVisitors) },
        { label: t('o.col.occupancy'), render: z => {
            const lv = level(z.initialVisitors, z.capacity);
            return `<div style="display:flex;align-items:center;gap:10px;min-width:180px">
              <div class="meter" style="flex:1"><i style="width:${Math.min(100, lv.percent)}%;background:${lv.color}"></i></div>
              <span class="badge" style="background:${lv.soft};color:#14211C"><span dir="ltr">${lv.percent}%</span> · ${esc(lv.label)}</span></div>`;
          } },
        { label: t('o.col.features'), render: z => [
            z.indoor ? `<span class="badge" style="background:#E4EEFB;color:#1A4E99">${I('home', 14)}${esc(t('o.zones.indoor'))}</span>` : '',
            z.hasPrayerArea ? `<span class="badge" style="background:#E6F0EC;color:var(--green-700)">${I('pray', 14)}${esc(t('o.zones.prayer'))}</span>` : ''
          ].join(' ') || '<span style="color:var(--muted)">—</span>' }
      ],
      fields: [
        { name: 'name', label: t('o.zones.name'), required: true, full: true, placeholder: 'Main Plaza', dir: 'ltr', help: t('o.zones.nameHelp') },
        { name: 'capacity', label: t('o.col.capacity'), type: 'number', required: true, min: 1 },
        { name: 'initialVisitors', label: t('o.col.visitors'), type: 'number', required: true, min: 0, help: t('o.zones.visHelp') },
        { name: 'hasPrayerArea', label: t('o.zones.prayerQ'), type: 'checkbox', icon: 'pray', full: true, help: t('o.zones.prayerHelp') },
        { name: 'indoor', label: t('o.zones.indoorQ'), type: 'checkbox', icon: 'home', full: true }
      ],
      create: d => api.post('/zone/add', d),
      update: (z, d) => api.put('/zone/update/' + z.id, d),
      remove: z => api.del('/zone/delete/' + z.id),
      deleteText: z => t('o.zones.del', { z: Mergab.zoneName(z) }),
      afterLoad: rows => {
        const name = decodeURIComponent(location.hash.slice(1));
        const hit = name && rows.find(r => r.name.toLowerCase() === name.toLowerCase());
        if (hit) { history.replaceState(null, '', location.pathname); table.open(hit); }
      }
    });
  }
</script>
</body>
</html>
