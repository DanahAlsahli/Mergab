<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<title data-i18n="login.title">مرقاب</title>
<script src="assets/js/i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="assets/css/mergab.css">
<style>
  .demo-acc { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: #FBFAF6; cursor: pointer; }
  .demo-acc:hover { background: var(--cream-2); }
  .auth-art { overflow: hidden; }
  .auth-art > * { position: relative; }
  .auth-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <section class="auth-art" aria-hidden="true" style="justify-content:space-between">
    <div class="geo" style="position:absolute"></div>
    <div id="artLogo" class="v-logo"></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <h2 style="font-weight:600;font-size:36px;line-height:1.35" data-i18n="login.artTitle"></h2>
      <p data-i18n="login.artText"></p>
      <div class="sadu" style="margin-top:14px;max-width:320px"></div>
    </div>
  </section>

  <main class="auth-form">
    <div class="auth-box">
      <div class="auth-top"><a class="v-logo" href="visitor/index.html" id="formLogo"></a><span id="langSlot"></span></div>
      <div>
        <h1 style="font-size:28px" data-i18n="login.h1"></h1>
        <p style="margin:6px 0 0;color:var(--muted)" data-i18n="login.sub"></p>
      </div>

      <div class="note" id="expired" hidden data-i18n="login.expired"></div>

      <form id="loginForm" style="display:flex;flex-direction:column;gap:14px" novalidate>
        <label class="field"><span data-i18n="f.email"></span><input type="email" name="email" required autocomplete="email" dir="ltr" placeholder="name@example.com"></label>
        <label class="field"><span data-i18n="f.password"></span><input type="password" name="password" required autocomplete="current-password"></label>
        <div id="err" role="alert" hidden style="padding:10px 12px;border-radius:10px;background:#FBECEA;color:#8E2A20;font-size:14px"></div>
        <button type="submit" class="btn btn-primary" data-i18n="login.submit"></button>
      </form>

      <p style="margin:0;text-align:center;color:var(--muted);font-size:14.5px"><span data-i18n="login.noAccount"></span> <a href="visitor/register.html" style="font-weight:700" data-i18n="login.createVisitor"></a></p>
      <p style="margin:0;text-align:center;color:var(--muted);font-size:13px" data-i18n="login.orgNote"></p>

      <section id="demoBox" hidden class="card" style="padding:14px;display:flex;flex-direction:column;gap:8px;border-style:dashed" aria-labelledby="demoT">
        <b id="demoT" style="font-size:13.5px;color:var(--ink-2)" data-i18n="login.demo"></b>
        <div id="demoList" style="display:flex;flex-direction:column;gap:8px"></div>
        <button type="button" id="resetDemo" class="v-link" style="background:none;border:0;padding:4px 0;cursor:pointer;font:inherit;font-size:13px;align-self:flex-start" data-i18n="login.demoReset"></button>
      </section>

      <a class="v-link" href="visitor/index.html" id="browse"></a>
    </div>
  </main>
</div>

<script src="assets/js/site-config.js"></script>
<script src="assets/js/mock-server.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/visitor.js"></script>
<script>
  const { auth, roleBadge, toast, esc } = Mergab;
  const params = new URLSearchParams(location.search);
  const emailInput = document.querySelector('[name=email]');
  if (I18n.isAr) emailInput.style.textAlign = 'right';

  // اللوقو + زر اللغة
  document.getElementById('formLogo').innerHTML = Visitor.logoHtml(false);
  document.getElementById('artLogo').innerHTML = Visitor.logoHtml(true);
  Visitor.wireLogos(document);
  document.getElementById('langSlot').innerHTML = Visitor.langButton();
  document.getElementById('browse').innerHTML = esc(t('login.browse')) + ' ' + Visitor.next(16);

  if (params.get('expired')) document.getElementById('expired').hidden = false;
  const current = auth.get();
  if (current) location.replace(auth.home(current.role));

  // يرجع للصفحة اللي كان يبيها لو دوره يسمح، غير كذا لصفحة دوره
  function destination(user) {
    const next = params.get('next');
    const allowed = { VISITOR: '/visitor/', ORGANIZER: '/organizer/', ADMIN: '/admin/' }[user.role];
    if (next && next.startsWith('/') && !next.startsWith('//') && next.includes(allowed)) return next;
    return auth.home(user.role);
  }

  async function doLogin(email, password) {
    const err = document.getElementById('err');
    err.hidden = true;
    try {
      const user = await auth.login(email, password);
      location.href = destination(user);
    } catch (e) {
      err.textContent = e.status === 401 ? t('login.errInvalid') : (e.message || t('login.errGeneric'));
      err.hidden = false;
    }
  }

  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target;
    if (!f.checkValidity()) { f.reportValidity(); return; }
    doLogin(f.email.value.trim(), f.password.value);
  });

  if (Mergab.MODE === 'mock') {
    document.getElementById('demoBox').hidden = false;
    document.getElementById('demoList').innerHTML = MockServer.demoAccounts.map((a, i) =>
      `<button type="button" class="demo-acc" data-i="${i}"><span dir="ltr" style="font-size:14px">${a.email}</span>${roleBadge(a.role)}</button>`).join('');
    document.getElementById('demoList').addEventListener('click', e => {
      const b = e.target.closest('[data-i]');
      if (!b) return;
      const a = MockServer.demoAccounts[b.dataset.i];
      const f = document.getElementById('loginForm');
      f.email.value = a.email; f.password.value = a.password;
      doLogin(a.email, a.password);
    });
    document.getElementById('resetDemo').addEventListener('click', () => { MockServer.reset(); toast(t('login.demoResetDone'), 'success'); });
  }
</script>
</body>
</html>
