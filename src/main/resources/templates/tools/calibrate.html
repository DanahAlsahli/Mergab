<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرقاب — معايرة خريطة الزائر</title>
<link rel="stylesheet" href="../../static/css/mergab.css">
<style>
  body { background: var(--cream); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .cal-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .cal-grid { grid-template-columns: minmax(0, 1fr); } }
  .stage { position: relative; display: inline-block; width: 100%; cursor: crosshair; border-radius: 14px; overflow: hidden; background: #10231D; }
  .stage img { display: block; width: 100%; height: auto; user-select: none; }
  .pt { position: absolute; transform: translate(-50%, -100%); padding: 4px 9px; border-radius: 8px; background: #fff; color: #14211C; font-size: 12px; font-weight: 700; white-space: nowrap; box-shadow: 0 3px 10px rgba(0,0,0,.35); pointer-events: none; }
  .pt::after { content: ''; position: absolute; left: 50%; top: 100%; margin-left: -6px; border: 6px solid transparent; border-top-color: #fff; }
  .pt.active { background: var(--gold); }
  .pt.active::after { border-top-color: var(--gold); }
  .zrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 10px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; }
  .zrow[aria-current="true"] { border-color: var(--gold); background: #FFF8EA; }
  .zrow small { color: var(--muted); }
  textarea { width: 100%; min-height: 220px; font: 12px/1.5 ui-monospace, monospace; padding: 10px; border-radius: 10px; border: 1px solid var(--line); direction: ltr; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1 style="font-size:26px">معايرة خريطة الزائر</h1>
    <p style="margin:6px 0 0;color:var(--muted)">١) حطي صورة الخريطة في <code dir="ltr">assets/img/map/</code> &nbsp; ٢) اختاري منطقة من القائمة واضغطي مكانها على الصورة (تنتقل للي بعدها تلقائيًا) &nbsp; ٣) انسخي الكود وحطيه مكان <code dir="ltr">map: {…}</code> في <code dir="ltr">assets/js/site-config.js</code></p>
  </div>

  <div class="card card-pad" style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">
    <label class="field" style="flex:1 1 320px">مسار الصورة (من جذر الموقع)
      <input id="src" value="assets/img/map/expo-map.jpg" dir="ltr">
    </label>
    <button type="button" class="btn btn-primary" id="loadBtn">تحميل الصورة</button>
    <span id="imgMsg" style="color:#8E2A20;font-size:14px"></span>
  </div>

  <div class="cal-grid">
    <div class="stage" id="stage"><img id="img" alt="خريطة المعرض"></div>

    <aside class="card card-pad" style="display:flex;flex-direction:column;gap:12px">
      <h2 style="font-size:17px">المناطق</h2>
      <div id="zones" style="display:flex;flex-direction:column;gap:6px"></div>
      <label class="field">المنطقة الوسطية (المسارات تمر فيها)<select id="hub"></select></label>
      <label class="field" style="flex-direction:row;align-items:center;gap:8px;font-weight:500">
        <input type="checkbox" id="hideUnset" style="width:18px;min-height:18px;height:18px"> لا تضيف المناطق اللي ما حددتها
      </label>
      <textarea id="out" readonly aria-label="الكود الناتج"></textarea>
      <button type="button" class="btn btn-gold" id="copyBtn">نسخ الكود</button>
    </aside>
  </div>
</div>

<script src="../../static/js/site-config.js"></script>
<script>
  const CFG = window.MERGAB_CONFIG.map;
  // نبدأ من مناطق site-config الحالية (تقدرين تعدلين الأسماء من هناك)
  const zones = CFG.zones.map(z => ({ key: z.key, name: z.name, x: null, y: null }));
  let active = 0;

  const img = document.getElementById('img'), stage = document.getElementById('stage');
  function load() {
    document.getElementById('imgMsg').textContent = '';
    img.src = '../' + document.getElementById('src').value.trim();
  }
  img.addEventListener('error', () => document.getElementById('imgMsg').textContent = 'ما لقيت الصورة في هذا المسار');
  document.getElementById('loadBtn').addEventListener('click', load);
  load();

  stage.addEventListener('click', e => {
    if (!img.naturalWidth) return;
    const r = img.getBoundingClientRect();
    zones[active].x = +((e.clientX - r.left) / r.width * 100).toFixed(1);
    zones[active].y = +((e.clientY - r.top) / r.height * 100).toFixed(1);
    const nextUnset = zones.findIndex((z, i) => i > active && z.x == null);
    active = nextUnset >= 0 ? nextUnset : active;
    render();
  });

  function render() {
    stage.querySelectorAll('.pt').forEach(p => p.remove());
    zones.forEach((z, i) => {
      if (z.x == null) return;
      const p = document.createElement('div');
      p.className = 'pt' + (i === active ? ' active' : '');
      p.style.left = z.x + '%'; p.style.top = z.y + '%';
      p.textContent = z.name.ar;
      stage.appendChild(p);
    });
    document.getElementById('zones').innerHTML = zones.map((z, i) => `
      <div class="zrow" data-i="${i}" aria-current="${i === active}" role="button" tabindex="0">
        <span><b>${z.name.ar}</b> <small dir="ltr">${z.name.en}</small></span>
        <small dir="ltr">${z.x == null ? '—' : z.x + ', ' + z.y}</small>
      </div>`).join('');
    const hub = document.getElementById('hub');
    const cur = hub.value || CFG.hub;
    hub.innerHTML = zones.map(z => `<option value="${z.key}"${z.key === cur ? ' selected' : ''}>${z.name.ar}</option>`).join('');
    output();
  }
  document.getElementById('zones').addEventListener('click', e => {
    const r = e.target.closest('[data-i]');
    if (r) { active = Number(r.dataset.i); render(); }
  });
  document.getElementById('hub').addEventListener('change', output);
  document.getElementById('hideUnset').addEventListener('change', output);

  function output() {
    const only = document.getElementById('hideUnset').checked;
    const list = zones.filter(z => !only || z.x != null);
    const lines = list.map(z => `      { key: '${z.key}', name: { ar: '${z.name.ar}', en: '${z.name.en}' }, x: ${z.x == null ? 50 : z.x}, y: ${z.y == null ? 50 : z.y} }`);
    document.getElementById('out').value =
`  map: {
    src: '${document.getElementById('src').value.trim()}',
    hub: '${document.getElementById('hub').value || CFG.hub}',
    zones: [
${lines.join(',\n')}
    ]
  }`;
  }
  document.getElementById('copyBtn').addEventListener('click', async () => {
    const ta = document.getElementById('out');
    try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); document.execCommand('copy'); }
    document.getElementById('copyBtn').textContent = 'تم النسخ';
    setTimeout(() => document.getElementById('copyBtn').textContent = 'نسخ الكود', 1500);
  });
  render();
</script>
</body>
</html>
