<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<title data-i18n="events.title">مرقاب</title>
<script src="../assets/js/i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/mergab.css">
</head>
<body>
<header id="vHeader"></header>

<main class="v-wrap">
  <div class="v-map-head">
    <div><h1 class="section-title-sa" data-i18n="events.h1"></h1><p data-i18n="events.sub"></p></div>
    <label class="o-search" style="flex:0 1 340px;min-height:44px">
      <span class="sr-only" data-i18n="events.search"></span>
      <input type="search" id="search" data-i18n-placeholder="events.search">
    </label>
  </div>

  <div class="chips" id="when" role="group" data-i18n-aria="events.when" style="margin-bottom:10px"></div>
  <div class="chips" id="zoneChips" role="group" data-i18n-aria="events.zone" style="margin-bottom:20px"></div>

  <div class="event-grid" id="events"></div>
</main>

<footer id="vFooter"></footer>

<script src="../assets/js/site-config.js"></script>
<script src="../assets/js/mock-server.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/visitor.js"></script>
<script>
  const { api, esc, level, zoneName, fmtTime, fmtDate, toDate, isToday } = Mergab;
  const I = Visitor.icon;
  const params = new URLSearchParams(location.search);
  let ZONES = [], EVENTS = [], when = params.get('when') || 'upcoming', zone = 'all', q = '';
  const WHEN = ['upcoming', 'today', 'tomorrow', 'all'];

  function chipGroup(el, items, current) {
    el.innerHTML = items.map(i => `<button type="button" class="chip" data-v="${esc(i[0])}" aria-pressed="${i[0] === current}">${esc(i[1])}</button>`).join('');
  }
  const zoneItems = () => [['all', t('events.allZones')]].concat(ZONES.map(z => [String(z.id), zoneName(z)]));

  function render() {
    const now = new Date(), tm = new Date(); tm.setDate(tm.getDate() + 1);
    let list = EVENTS.slice();
    if (when === 'upcoming') list = list.filter(e => toDate(e.endDateTime) >= now);
    if (when === 'today') list = list.filter(e => isToday(e.startDateTime));
    if (when === 'tomorrow') list = list.filter(e => toDate(e.startDateTime).toDateString() === tm.toDateString());
    if (zone !== 'all') list = list.filter(e => e.zone && String(e.zone.id) === zone);
    if (q) list = list.filter(e => e.name.toLowerCase().includes(q) || zoneName(e.zone).toLowerCase().includes(q));
    list.sort((a, b) => toDate(a.startDateTime) - toDate(b.startDateTime));

    document.getElementById('events').innerHTML = list.length ? list.map(e => {
      const z = ZONES.find(x => e.zone && x.id === e.zone.id) || e.zone || {};
      const lv = z.capacity ? level(z.initialVisitors, z.capacity) : null;
      const live = toDate(e.startDateTime) <= now && toDate(e.endDateTime) >= now;
      return `<article class="card event-card">
        <div class="art" style="${Visitor.zoneArt(z)}"><span class="img-shade"></span><span class="badge" style="position:relative">${live ? '● ' + esc(t('now')) : (isToday(e.startDateTime) ? esc(t('today')) : fmtDate(e.startDateTime))}</span></div>
        <div class="body"><h3>${esc(e.name)}</h3>
          <span class="row">${I('clock', 16)}${fmtTime(e.startDateTime)} – ${fmtTime(e.endDateTime)}</span>
          <span class="row">${I('pin', 16)}${esc(zoneName(z))}</span>
          <div class="foot">
            ${lv ? `<span class="badge" style="background:${lv.soft};color:#14211C">${esc(t('crowd', { l: lv.label }))}</span>` : '<span></span>'}
            <a class="v-link" href="map.html?zone=${encodeURIComponent(z.name || '')}">${esc(t('onMap'))} ${Visitor.next(14)}</a>
          </div></div></article>`;
    }).join('') : `<div class="empty">${esc(t('events.empty'))}</div>`;
  }

  const whenEl = document.getElementById('when'), zoneEl = document.getElementById('zoneChips');
  const whenItems = WHEN.map(w => [w, t('chip.' + w)]);
  chipGroup(whenEl, whenItems, when);
  whenEl.addEventListener('click', e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    when = b.dataset.v; chipGroup(whenEl, whenItems, when); render();
  });
  zoneEl.addEventListener('click', e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    zone = b.dataset.v; chipGroup(zoneEl, zoneItems(), zone); render();
  });
  document.getElementById('search').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });

  document.getElementById('events').innerHTML = `<div class="empty">${esc(t('loading'))}</div>`;
  Promise.all([api.get('/zone/get'), api.get('/expo-event/get')]).then(([zs, evs]) => {
    ZONES = zs; EVENTS = evs;
    chipGroup(zoneEl, zoneItems(), zone);
    render();
  });
</script>
</body>
</html>
