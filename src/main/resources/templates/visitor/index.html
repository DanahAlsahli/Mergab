<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../../static/img/favicon.png">
<title data-i18n="home.title">مرقاب</title>
<script src="../../static/js/i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../static/css/mergab.css">
</head>
<body>
<header id="vHeader"></header>

<main>
  <section class="v-hero-sa" id="hero">
    <div class="geo" aria-hidden="true"></div>
    <div class="v-hero-in">
      <span class="eyebrow" data-i18n="motto"></span>
      <h1 data-i18n="home.heroTitle"></h1>
      <span class="sub" style="font-family:var(--kufi);font-size:clamp(18px,2.4vw,26px);font-weight:600" data-i18n="home.heroSub"></span>
      <p data-i18n="home.heroText"></p>
      <form class="v-search" action="map.html" role="search">
        <label class="sr-only" for="q" data-i18n="home.searchLabel"></label>
        <input id="q" name="q" type="search" data-i18n-placeholder="home.searchPh">
        <button class="btn btn-primary" type="submit" data-i18n="home.searchBtn"></button>
      </form>
      <div class="v-quick" id="quick"></div>
    </div>
  </section>
  <div class="sadu" aria-hidden="true"></div>

  <div class="v-wrap">
    <div id="ctxBar" aria-live="polite"></div>
    <section class="v-section" aria-labelledby="featTitle">
      <div class="v-section-head" style="justify-content:center;text-align:center">
        <div><h2 id="featTitle" data-i18n="home.feat.title"></h2><p data-i18n="home.feat.sub"></p></div>
      </div>
      <div class="feat-grid" id="features"></div>
    </section>

    <section class="v-section" aria-labelledby="zonesTitle">
      <div class="v-section-head">
        <div><h2 id="zonesTitle" class="section-title-sa" data-i18n="home.zones.title"></h2><p data-i18n="home.zones.sub"></p></div>
        <a class="v-link" href="map.html" id="allZones"></a>
      </div>
      <div class="zone-grid" id="zones"></div>
    </section>

    <section class="v-section" aria-labelledby="evTitle">
      <div class="v-section-head">
        <div><h2 id="evTitle" class="section-title-sa" data-i18n="home.events.title"></h2></div>
        <a class="v-link" href="events.html" id="allEvents"></a>
      </div>
      <div class="chips" id="evFilter" role="group" data-i18n-aria="home.events.filter" style="margin-bottom:16px"></div>
      <div class="event-grid" id="events"></div>
    </section>

    <section class="cta-band" aria-labelledby="ctaTitle" style="position:relative">
      <div class="geo" aria-hidden="true"></div>
      <div style="position:relative"><h2 id="ctaTitle" data-i18n="home.cta.title"></h2><p data-i18n="home.cta.sub"></p></div>
      <a class="btn btn-gold" href="map.html#planner" style="position:relative" data-i18n="home.cta.btn"></a>
      <div class="cta-points" id="ctaPoints" style="position:relative"></div>
    </section>
  </div>
</main>

<footer id="vFooter"></footer>

<script src="../../static/js/site-config.js"></script>
<script src="../../static/js/mock-server.js"></script>
<script src="../../static/js/api.js"></script>
<script src="../../static/js/visitor.js"></script>
<script>
  const { api, esc, num, level, zoneName, fmtTime, fmtDate, toDate, isToday } = Mergab;
  const I = Visitor.icon;
  const CFG = window.MERGAB_CONFIG;

  // صورة الهيرو (لو موجودة) فوق الصورة الاحتياطية
  document.getElementById('hero').style.backgroundImage =
    `linear-gradient(180deg, rgba(10,32,25,.35) 0%, rgba(10,32,25,.82) 100%), url('${Mergab.ROOT + CFG.heroImage}'), url('${Mergab.ROOT}assets/map/sample-map.jpg')`;

  document.getElementById('allZones').innerHTML = t('home.zones.all') + ' ' + Visitor.next(16);
  document.getElementById('allEvents').innerHTML = t('home.events.all') + ' ' + Visitor.next(16);

  document.getElementById('quick').innerHTML = [
    ['map.html', 'map', 'home.quick.map'],
    ['events.html?when=today', 'calendar', 'home.quick.today'],
    ['map.html#planner', 'route', 'home.quick.plan'],
    ['map.html#planner', 'nav', 'home.quick.route']
  ].map(q => `<a href="${q[0]}">${I(q[1], 18)}${esc(t(q[2]))}</a>`).join('');

  document.getElementById('features').innerHTML = [
    ['map.html', 'map', '#E3F2E9', '#1F6B45', 1],
    ['events.html', 'calendar', '#FBF0DD', '#A8641A', 2],
    ['map.html#planner', 'route', '#EEE9FB', '#5B3FB0', 3],
    ['map.html#suggest', 'spark', '#E4EEFB', '#1A4E99', 4]
  ].map(f => `<a class="card feat" href="${f[0]}"><span class="ic" style="background:${f[2]};color:${f[3]}">${I(f[1], 28)}</span>
     <h3>${esc(t('home.feat' + f[4] + '.t'))}</h3><p>${esc(t('home.feat' + f[4] + '.d'))}</p></a>`).join('');

  document.getElementById('ctaPoints').innerHTML = [['spark', 1], ['users', 2], ['route', 3], ['clock', 4]]
    .map(p => `<span>${I(p[0], 18)}${esc(t('home.cta.p' + p[1]))}</span>`).join('');

  Visitor.prayerBar(document.getElementById('ctxBar'));

  let ZONES = [], EVENTS = [], filter = 'all';

  function badge(z) {
    const lv = level(z.initialVisitors, z.capacity);
    return `<span class="badge" style="background:${lv.soft};color:#14211C"><i aria-hidden="true" style="width:7px;height:7px;border-radius:50%;background:${lv.color}"></i>${esc(t('crowd', { l: lv.label }))}</span>`;
  }

  function renderZones() {
    document.getElementById('zones').innerHTML = ZONES.length ? ZONES.slice(0, 8).map(z => {
      const s = Visitor.zoneStyle(z);
      return `<a class="card zone-card" href="map.html?zone=${encodeURIComponent(z.name)}">
        <div class="art" style="${Visitor.zoneArt(z)}"><span class="img-shade"></span>
          <span style="position:absolute;inset-inline-end:12px;top:12px;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center">${I(s.icon, 22, '#fff')}</span></div>
        <div class="body"><h3>${esc(zoneName(z))}</h3>${badge(z)}<span class="cap">${esc(t('home.zones.cap', { n: num(z.capacity) }))}</span></div></a>`;
    }).join('') : `<div class="empty">${esc(t('home.zones.empty'))}</div>`;
  }

  function renderEvents() {
    const now = new Date();
    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
    let list = EVENTS.filter(e => toDate(e.endDateTime) >= now);
    if (filter === 'today') list = list.filter(e => isToday(e.startDateTime));
    if (filter === 'tomorrow') list = list.filter(e => toDate(e.startDateTime).toDateString() === tomorrow.toDateString());
    if (filter === 'quiet') list = list.filter(e => {
      const z = ZONES.find(x => e.zone && x.id === e.zone.id);
      return z && level(z.initialVisitors, z.capacity).ratio < 0.75;
    });
    list.sort((a, b) => toDate(a.startDateTime) - toDate(b.startDateTime));
    document.getElementById('events').innerHTML = list.length ? list.slice(0, 8).map(e => {
      const z = ZONES.find(x => e.zone && x.id === e.zone.id) || e.zone || {};
      return `<article class="card event-card">
        <div class="art" style="${Visitor.zoneArt(z)}"><span class="img-shade"></span><span class="badge" style="position:relative">${esc(zoneName(z))}</span></div>
        <div class="body"><h3>${esc(e.name)}</h3>
          <span class="row">${I('clock', 16)}${isToday(e.startDateTime) ? esc(t('today')) : fmtDate(e.startDateTime)} · ${fmtTime(e.startDateTime)} – ${fmtTime(e.endDateTime)}</span>
          <span class="row">${I('pin', 16)}${esc(zoneName(z))}</span>
          <div class="foot">${z.capacity ? badge(z) : ''}<a class="v-link" href="map.html?zone=${encodeURIComponent(z.name || '')}">${esc(t('onMap'))}</a></div>
        </div></article>`;
    }).join('') : `<div class="empty">${esc(t('home.events.empty'))}</div>`;
  }

  const chips = ['all', 'today', 'tomorrow', 'quiet'];
  const evFilter = document.getElementById('evFilter');
  evFilter.innerHTML = chips.map(c => `<button type="button" class="chip" data-f="${c}" aria-pressed="${c === filter}">${esc(t('chip.' + c))}</button>`).join('');
  evFilter.addEventListener('click', e => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    filter = b.dataset.f;
    evFilter.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    renderEvents();
  });

  document.getElementById('zones').innerHTML = document.getElementById('events').innerHTML = `<div class="empty">${esc(t('loading'))}</div>`;
  Promise.all([api.get('/zone/get'), api.get('/expo-event/get')]).then(([zs, evs]) => {
    ZONES = zs; EVENTS = evs;
    renderZones(); renderEvents();
  });
</script>
</body>
</html>
