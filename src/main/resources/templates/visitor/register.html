<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<title data-i18n="reg.title">مرقاب</title>
<script src="../assets/js/i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/mergab.css">
</head>
<body>
<header id="vHeader"></header>

<main class="v-wrap" style="display:flex;justify-content:center;padding-top:40px;padding-bottom:20px">
  <section class="card card-pad" style="width:min(480px,100%);display:flex;flex-direction:column;gap:18px;overflow:hidden;padding-top:0" aria-labelledby="h">
    <div class="sadu sadu-thin" aria-hidden="true" style="margin:0 -22px"></div>
    <div>
      <h1 id="h" style="font-size:26px" data-i18n="reg.h1"></h1>
      <p style="margin:6px 0 0;color:var(--muted)" data-i18n="reg.sub"></p>
      <p style="margin:8px 0 0;font-size:13.5px;color:var(--muted)"><span data-i18n="reg.have"></span> <a href="../login.html" style="font-weight:700" data-i18n="reg.loginLink"></a></p>
    </div>
    <form id="regForm" style="display:flex;flex-direction:column;gap:14px" novalidate>
      <label class="field"><span data-i18n="f.fullName"></span><input type="text" name="fullName" required minlength="3" maxlength="50" autocomplete="name"></label>
      <label class="field"><span data-i18n="f.email"></span><input type="email" name="email" required autocomplete="email" dir="ltr"></label>
      <label class="field"><span data-i18n="f.phone"></span><input type="tel" name="phoneNumber" required pattern="05[0-9]{8}" placeholder="05XXXXXXXX" autocomplete="tel" dir="ltr"><small data-i18n="f.phoneHelp"></small></label>
      <label class="field"><span data-i18n="f.password"></span><input type="password" name="password" required minlength="6" autocomplete="new-password"><small data-i18n="f.passHelp"></small></label>
      <label class="opt-card"><input type="checkbox" name="showPrayerTimes" class="switch"><span class="ic" data-ic="pray"></span>
        <span class="txt"><b data-i18n="opt.prayer"></b><small data-i18n="opt.prayerHelp"></small></span></label>
      <button type="submit" class="btn btn-primary" data-i18n="reg.submit"></button>
    </form>
  </section>
</main>

<footer id="vFooter"></footer>

<script src="../assets/js/site-config.js"></script>
<script src="../assets/js/mock-server.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/visitor.js"></script>
<script>
  const form = document.getElementById('regForm');
  document.querySelectorAll('[data-ic]').forEach(el => el.innerHTML = Visitor.icon(el.dataset.ic, 22));
  // في العربي: حقول الإيميل والجوال تبدأ من اليمين
  if (I18n.isAr) form.querySelectorAll('[dir=ltr]').forEach(i => i.style.textAlign = 'right');
  const me = Mergab.auth.get();
  if (me) location.replace(me.role === 'VISITOR' ? 'account.html' : Mergab.auth.home(me.role));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    try {
      await Mergab.api.post('/visitor/register', {
        fullName: form.fullName.value.trim(), email: form.email.value.trim(),
        phoneNumber: form.phoneNumber.value.trim(), password: form.password.value,
        showPrayerTimes: form.showPrayerTimes.checked
      });
      await Mergab.auth.login(form.email.value.trim(), form.password.value);   // يدخل مباشرة كزائر
      location.href = 'account.html?welcome=1';
    } catch (err) { /* الرسالة ظهرت */ }
  });
</script>
</body>
</html>
