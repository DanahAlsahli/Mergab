<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../../static/img/favicon.png">
<title data-i18n="o.t.dashboard">مرقاب</title>
<script src="../../static/js/i18n.js"></script>
<script src="../../static/js/i18n-staff.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../static/css/mergab.css">
<link rel="stylesheet" href="../../static/map/mirqab-map.css">
</head>
<body data-area="organizer" data-page="dashboard">
<header id="vHeader"></header>

<main>
  <section class="page-band o-band with-img" id="band">
    <div class="geo" aria-hidden="true"></div>
    <div class="o-wrap">
      <div><span class="eyebrow" data-i18n="motto"></span>
        <h1 id="bandH"></h1>
        <p id="bandP" data-i18n="o.dash.sub"></p></div>
      <div class="acts"><a class="btn btn-gold" href="events.html#add" id="actEv"></a><a class="btn btn-on-dark" href="simulations.html#add" id="actSim"></a></div>
    </div>
  </section>
  <div class="sadu" aria-hidden="true"></div>

  <div class="o-wrap o-body">
    <section class="kpis" aria-label="KPIs">
      <div class="card kpi"><span class="kpi-icon" style="background:#E6F0EC;color:var(--green-600)" data-icon="zones"></span>
        <span class="meta"><span data-i18n="o.k.zones"></span><b id="kZones">—</b><small id="kZonesSub" style="color:var(--muted)"></small></span></div>
      <div class="card kpi"><span class="kpi-icon" style="background:var(--gold-soft);color:#7A5A1E" data-icon="users"></span>
        <span class="meta"><span data-i18n="o.k.inside"></span><b id="kIn">—</b><small id="kInSub" style="color:var(--muted)"></small></span></div>
      <div class="card kpi"><span class="kpi-icon" style="background:#F7E3E0;color:#8E2A20" data-icon="events"></span>
        <span class="meta"><span data-i18n="o.k.today"></span><b id="kEv">—</b><small id="kEvSub" style="color:var(--muted)"></small></span></div>
      <div class="card kpi"><span class="kpi-icon" style="background:#E4ECE9;color:var(--green-900)" data-icon="simulations"></span>
        <span class="meta"><span data-i18n="o.k.sims"></span><b id="kSims">—</b><small id="kSimsSub" style="color:var(--muted)"></small></span></div>
    </section>

    <div class="o-grid-2">
      <section class="card card-pad" aria-labelledby="mapT">
        <div class="card-head"><h2 id="mapT" class="o-panel-title" data-i18n="o.dash.map"></h2><span class="badge badge-dot st-COMPLETED" data-i18n="live"></span></div>
        <div class="fc-bar" role="group" aria-labelledby="fcLbl">
          <span class="lbl" id="fcLbl"><span data-icon="spark" data-size="18"></span><span data-i18n="fc.title"></span></span>
          <div class="chips" id="fcChips">
            <button type="button" class="chip" data-m="0" aria-pressed="true" data-i18n="fc.now"></button>
            <button type="button" class="chip" data-m="30" aria-pressed="false" data-i18n="fc.m30"></button>
            <button type="button" class="chip" data-m="60" aria-pressed="false" data-i18n="fc.h1"></button>
            <button type="button" class="chip" data-m="120" aria-pressed="false" data-i18n="fc.h2"></button>
          </div>
        </div>
        <div id="expoMap" class="v-map" style="height:470px"></div>
      </section>

      <div class="o-stack">
        <section class="card card-pad" aria-labelledby="alT">
          <div class="card-head"><h2 id="alT" class="o-panel-title"><span data-icon="pray" data-size="22"></span><span data-i18n="o.dash.prayer"></span></h2></div>
          <div id="prNow"></div>
          <div class="pr-mini" id="prMini"></div>
          <div style="margin-top:14px"><small style="color:var(--muted)" data-i18n="o.dash.shareLbl"></small>
            <div class="share-bar"><div class="meter"><i id="shareBar" style="width:0;background:var(--green-600)"></i></div><b id="shareVal" dir="ltr">—</b></div></div>
          <h3 style="font-size:15px;margin:18px 0 4px" data-i18n="o.dash.alerts"></h3>
          <div id="alerts"><div class="empty" data-i18n="loading"></div></div>
        </section>

        <section class="card card-pad" aria-labelledby="occT">
          <div class="card-head"><h2 id="occT" data-i18n="o.dash.occ"></h2><a class="v-link" href="zones.html" data-i18n="o.viewAll"></a></div>
          <div class="crowd-list" id="occ"></div>
        </section>
      </div>
    </div>

    <section class="card card-pad" aria-labelledby="evT">
      <div class="card-head"><h2 id="evT" data-i18n="o.dash.upcoming"></h2><a class="v-link" href="events.html" data-i18n="o.viewAll"></a></div>
      <div id="evList" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px"><div class="empty" data-i18n="loading"></div></div>
    </section>
  </div>
</main>

<footer id="vFooter"></footer>

<script src="../../static/js/site-config.js"></script>
<script src="../../static/js/mock-server.js"></script>
<script src="../../static/js/api.js"></script>
<script src="../../static/js/organizer.js"></script>
<script src="../../static/map/mirqab-map.js"></script>
<script>
  const { api, esc, num, level, zoneName, fmtTime, fmtDate, toDate, isToday } = Mergab;
  const I = Org.icon;
  const CFG = window.MERGAB_CONFIG;
  const user = Org.shell();
  if (user) {
    document.getElementById('bandH').textContent = t('o.hello', { n: user.fullName.split(' ')[0] });
    document.getElementById('band').style.backgroundImage =
      `linear-gradient(90deg, rgba(10,44,36,.95) 0%, rgba(10,44,36,.82) 45%, rgba(10,44,36,.35) 100%), url('${Mergab.ROOT + CFG.heroImage}')`;
    document.getElementById('actEv').innerHTML = I('plus', 18) + ' ' + esc(t('o.ev.add'));
    document.getElementById('actSim').innerHTML = I('simulations', 18) + ' ' + esc(t('o.sim.add'));

    const expoMap = MirqabMap.create('#expoMap', {
      mode: 'image', lang: I18n.lang, demo: false,
      imageLayout: { src: Mergab.ROOT + CFG.map.src, hub: CFG.map.hub, zones: CFG.map.zones, metersPerUnit: CFG.map.metersPerUnit || 8 },
      imageFit: 'contain',
      onSelect: z => location.href = 'zones.html#' + encodeURIComponent(z.dbName || z.name)
    });

    const dq = () => { const q = new URLSearchParams(location.search).get('simulateTime'); return q ? 'simulateTime=' + encodeURIComponent(q) : ''; };
    let ZONES = [], FC = null, fcMin = 0;

    function paintMap() {
      if (!fcMin || !FC) { expoMap.setOccupancy(ZONES); return; }
      expoMap.setOccupancy(FC.zones.map(f => {
        const p = f.points.find(x => x.minute === fcMin) || f.points[f.points.length - 1];
        return Object.assign({}, f.zone, { initialVisitors: p.expectedVisitors });
      }));
    }
    document.getElementById('fcChips').addEventListener('click', e => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      fcMin = Number(b.dataset.m);
      document.querySelectorAll('#fcChips [data-m]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      document.getElementById('expoMap').classList.toggle('is-forecast', !!fcMin);
      paintMap();
    });

    // أوقات الصلاة + التنبيهات (GET /prayer/today و /forecast/zones)
    async function loadPrayer() {
      const q = dq();
      const [c, fc] = await Promise.all([api.get('/prayer/today' + (q ? '?' + q : '')), api.get('/forecast/zones?hours=2&step=15' + (q ? '&' + q : ''))]);
      FC = fc; paintMap();
      if (c && c.prayers) {
        const pn = k => t('pr.' + k);
        const nx = c.nextPrayer;
        const h = Math.floor(nx.minutesLeft / 60), m = nx.minutesLeft % 60;
        document.getElementById('prNow').innerHTML = `<div class="pr-next" style="padding:14px 16px"><span>${esc(t('visit.nextIs'))}</span>
          <b style="font-size:19px">${esc(c.currentPrayer ? t('ctx.now', { p: pn(c.currentPrayer) }) : (h ? t('ctx.nextH', { p: pn(nx.key), h, m }) : t('ctx.next', { p: pn(nx.key), m })))}</b>
          <small>${esc(t('ctx.at', { t: nx.time }))}</small></div>`;
        document.getElementById('prMini').innerHTML = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'].map(k =>
          `<span class="${k === nx.key ? 'is-next' : ''}">${esc(pn(k))} <b dir="ltr">${esc(c.prayers[k])}</b></span>`).join('');
      }
      const share = Math.round((fc.prayerOptInShare || 0) * 100);
      document.getElementById('shareBar').style.width = share + '%';
      document.getElementById('shareVal').textContent = share + '%';

      const al = (fc.zones || []).map(f => {
        const top = f.points.reduce((a, b) => b.percent > a.percent ? b : a);
        return { f, top };
      }).filter(x => x.top.percent >= 85 && x.top.minute > 0).sort((a, b) => b.top.percent - a.top.percent);
      document.getElementById('alerts').innerHTML = al.length ? al.map(x => {
        const lv = level(x.top.expectedVisitors, x.f.zone.capacity);
        const rs = x.top.reasons[0];
        const why = rs ? t('fc.r.' + rs.code, { p: rs.prayer ? t('pr.' + rs.prayer) : '' }) : t('o.dash.demand');
        return `<div class="alert-row"><span class="ic" style="background:${lv.soft};color:${lv.color}">${I('warning', 20)}</span>
          <span class="meta"><b>${esc(t('o.dash.alert', {z: zoneName(x.f.zone), t: x.top.time}))}</b><small>${esc(why)}</small>
          <a class="v-link" style="font-size:13px" href="simulations.html#add">${esc(t('o.dash.plan'))}</a></span>
          <span class="pct" dir="ltr" style="color:${lv.color}">${x.top.percent}%</span></div>`;
      }).join('') : `<div class="empty" style="padding:14px 0">${I('check', 22, '#1F6B45')}<br>${esc(t('o.dash.noAlerts'))}</div>`;
    }

    async function loadAll() {
      const [zones, events, sims] = await Promise.all([api.get('/zone/get'), api.get('/expo-event/get'), api.get('/simulation/get-all')]);
      ZONES = zones; paintMap();
      const crowded = zones.filter(z => level(z.initialVisitors, z.capacity).ratio >= 0.75).length;
      const cap = zones.reduce((s, z) => s + (z.capacity || 0), 0);
      const vis = zones.reduce((s, z) => s + (z.initialVisitors || 0), 0);
      const todayEv = events.filter(e => isToday(e.startDateTime)).length;
      document.getElementById('kZones').textContent = num(zones.length);
      document.getElementById('kZonesSub').textContent = t('o.k.crowded', { n: crowded });
      document.getElementById('kIn').textContent = num(vis);
      document.getElementById('kInSub').textContent = t('o.k.ofCap', { p: cap ? Math.round(vis / cap * 100) : 0, c: num(cap) });
      document.getElementById('kEv').textContent = num(todayEv);
      document.getElementById('kEvSub').textContent = t('o.k.evTotal', { n: events.length });
      document.getElementById('kSims').textContent = num(sims.filter(s => s.status === 'RUNNING' || s.status === 'PENDING').length);
      document.getElementById('kSimsSub').textContent = t('o.k.simDone', { n: sims.filter(s => s.status === 'COMPLETED').length });

      document.getElementById('occ').innerHTML = zones.slice().sort((a, b) => b.initialVisitors / b.capacity - a.initialVisitors / a.capacity).map(z => {
        const lv = level(z.initialVisitors, z.capacity);
        return `<a class="crowd-row" href="zones.html#${encodeURIComponent(z.name)}" style="text-decoration:none;color:inherit">
          <span class="ic" style="background:${lv.soft};color:${lv.color}">${I(z.hasPrayerArea ? 'pray' : 'zones', 18)}</span>
          <b>${esc(zoneName(z))}</b><span class="meter"><i style="width:${Math.min(100, lv.percent)}%;background:${lv.color}"></i></span>
          <span class="pct" dir="ltr">${lv.percent}%</span></a>`;
      }).join('');

      const now = new Date();
      const up = events.filter(e => toDate(e.endDateTime) >= now).sort((a, b) => toDate(a.startDateTime) - toDate(b.startDateTime)).slice(0, 6);
      document.getElementById('evList').innerHTML = up.length ? up.map(e => {
        const z = zones.find(x => e.zone && x.id === e.zone.id) || e.zone || {};
        const lv = level(z.initialVisitors || 0, z.capacity || 1);
        return `<div class="ev-row"><span class="ev-icon">${I('events', 18)}</span>
          <span class="meta"><b>${esc(e.name)}</b><small>${isToday(e.startDateTime) ? esc(t('today')) : fmtDate(e.startDateTime)} · ${fmtTime(e.startDateTime)} – ${fmtTime(e.endDateTime)}</small></span>
          <span class="zone"><i style="background:${lv.color}"></i>${esc(zoneName(z))}</span></div>`;
      }).join('') : `<div class="empty">${esc(t('o.dash.noUpcoming'))}</div>`;
    }
    loadAll(); loadPrayer();
    setInterval(loadAll, 30000);
  }
</script>
</body>
</html>
