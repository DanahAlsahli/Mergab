<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light"></head>
<body style="margin:0;background:#F5F5F2;font-family:Tahoma,Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0;">
<tr><td align="center">
  <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #E4DED1;">

    <tr><td bgcolor="#ffffff" style="background:#ffffff;padding:24px;text-align:center;border-bottom:4px solid #D4B483;">
      <img src="cid:logo" width="260" alt="Mirqab | مرقاب" style="display:block;margin:0 auto;">
    </td></tr>

    <tr><td style="padding:24px;text-align:right;font-size:15px;color:#14211C;">
      <p>أهلاً <strong th:text="${fullName}">الاسم</strong>، تم تسجيلك بنجاح </p>
      <p>هذي تذكرتك، اعرضها عند البوابة للدخول:</p>
    </td></tr>

    <tr><td align="center" style="padding:0 24px 20px;">
      <img src="cid:qrCode" width="220" height="220" alt="QR Ticket">
    </td></tr>


    <tr><td dir="ltr" style="padding:16px 24px;text-align:left;color:#66746D;border-top:1px solid #E4DED1;font-size:14px;">
      <p>Hi <strong th:text="${fullName}"></strong>, you're registered! Show the QR code above at the gate.</p>
    </td></tr>

  </table>
</td></tr>
</table>
</body>
</html>
